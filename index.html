<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sambriddhi Air Bus — Book Your Ticket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
:root{
  --asphalt:#06130c;
  --asphalt-2:#0b1f15;
  --paper:#eefbf3;
  --paper-2:#cfeedd;
  --ink:#04170d;
  --marigold:#34d98a;          /* primary accent (now green) */
  --marigold-dim:#1fa866;
  --pine:#1f9d63;
  --pine-dim:#14724a;
  --pink:#ff5fa2;              /* small accent only */
  --rust:#e23a4e;
  --rust-dim:#b3263a;
  --line:rgba(238,251,243,0.14);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter','Noto Sans Devanagari',sans-serif;background:radial-gradient(circle at 20% 10%,#0f3a24 0,#06130c 55%);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:20px;}
.app{position:relative;overflow:hidden;border-radius:18px;width:100%;max-width:480px;min-height:600px;background:var(--asphalt);box-shadow:0 30px 60px -20px rgba(0,0,0,0.7);}

/* ═══ LIVE ANIMATED BACKGROUND: shifting gradient · glowing orbs (canvas) · waves ═══ */
.bg-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;
  background:linear-gradient(135deg,#041109,#08301f,#0a2a1c,#2a0a18 115%);background-size:300% 300%;animation:bgshift 18s ease-in-out infinite;}
@keyframes bgshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
#live{position:absolute;inset:0;width:100%;height:100%;display:block;}
.waves{position:absolute;left:0;right:0;bottom:0;height:150px;}
.wave{position:absolute;left:0;bottom:0;width:200%;height:100%;animation:wavemove linear infinite;}
.wave.w1{animation-duration:14s;opacity:.55;}
.wave.w2{animation-duration:21s;animation-direction:reverse;opacity:.4;bottom:-6px;}
.wave.w3{animation-duration:30s;opacity:.35;bottom:-14px;}
@keyframes wavemove{to{transform:translateX(-50%)}}
.glowline{position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,#34d98a,#ff5fa2,#e23a4e,#34d98a,transparent);background-size:200% 100%;animation:glideline 5s linear infinite;opacity:.8;}
@keyframes glideline{to{background-position:200% 0}}

.content{position:relative;z-index:2;padding:1.5rem;}

/* language switch */
.lang{display:flex;justify-content:flex-end;margin-bottom:10px;}
.lang-pill{display:inline-flex;background:rgba(0,0,0,.35);border:1px solid rgba(52,217,138,.35);border-radius:30px;padding:3px;}
.lang-btn{border:none;background:transparent;color:rgba(238,251,243,.6);font-family:'Rajdhani','Noto Sans Devanagari',sans-serif;font-weight:700;font-size:13px;letter-spacing:1px;padding:5px 14px;border-radius:30px;cursor:pointer;transition:all .25s;}
.lang-btn.on{background:linear-gradient(90deg,#34d98a,#1fa866);color:var(--ink);box-shadow:0 4px 12px -4px rgba(52,217,138,.8);}

.header{text-align:center;margin-bottom:1.4rem;animation:slideDown 0.6s ease both;}
@keyframes slideDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
.logo-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(52,217,138,0.12);border:1px solid rgba(52,217,138,0.4);border-radius:30px;padding:5px 14px;margin-bottom:12px;animation:glow 2.4s ease-in-out infinite;}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(52,217,138,.5)}50%{box-shadow:0 0 16px 3px rgba(52,217,138,.35)}}
.logo-dot{width:7px;height:7px;background:#2fd67f;box-shadow:0 0 8px #2fd67f;border-radius:50%;animation:blink 1.6s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.25}}
.logo-text{font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:600;color:var(--marigold);letter-spacing:2.5px;text-transform:uppercase;}
.brand-name{font-family:'Rajdhani',sans-serif;font-size:36px;font-weight:700;line-height:1;letter-spacing:0.5px;
  background:linear-gradient(90deg,#34d98a,#a6f5c9,#34d98a,#ff5fa2 120%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 6s linear infinite;}
.brand-name span{-webkit-text-fill-color:transparent;}
@keyframes shimmer{to{background-position:250% 0}}
.route-strip{position:relative;overflow:hidden;height:22px;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;font-family:'Space Mono',monospace;font-size:11px;color:rgba(238,251,243,0.6);text-transform:uppercase;}
.route-strip .dash{width:26px;height:1px;background:repeating-linear-gradient(90deg,rgba(238,251,243,0.5) 0 4px,transparent 4px 8px);}
.busrun{position:absolute;left:-10%;top:0;font-size:15px;animation:busrun 6s linear infinite;}
@keyframes busrun{0%{left:-10%}100%{left:110%}}
.price-pill{display:inline-block;background:rgba(31,157,99,0.35);border:1px solid rgba(52,217,138,0.7);border-radius:20px;padding:4px 14px;font-size:12px;color:#9af5c6;margin-top:10px;font-family:'Rajdhani',sans-serif;font-weight:600;letter-spacing:1px;animation:floaty 3s ease-in-out infinite;}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

.steps{display:flex;margin-bottom:1.5rem;gap:6px;}
.step{flex:1;padding:9px 4px;text-align:center;font-size:10.5px;font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(238,251,243,0.4);background:rgba(0,0,0,0.3);border:1px solid var(--line);border-radius:7px;transition:all .4s cubic-bezier(.34,1.56,.64,1);}
.step.active{background:linear-gradient(90deg,#34d98a,#1fa866);color:var(--ink);border-color:var(--marigold);transform:translateY(-2px) scale(1.04);box-shadow:0 8px 18px -8px rgba(52,217,138,.9);}
.step.done{background:rgba(31,157,99,0.35);color:#9af5c6;border-color:rgba(52,217,138,0.6);animation:popIn .4s both;}

.panel{display:none;}
.panel.active{display:block;animation:panelIn .55s cubic-bezier(.2,.8,.2,1);}
@keyframes panelIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.sec-label{font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--marigold);margin-bottom:10px;}

.routes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem;}
.rc{background:rgba(0,0,0,0.32);border:1px solid var(--line);border-radius:10px;padding:12px 8px;cursor:pointer;text-align:center;transition:all .3s cubic-bezier(.34,1.56,.64,1);}
.rc:hover{border-color:rgba(52,217,138,0.6);background:rgba(52,217,138,0.07);transform:translateY(-5px) scale(1.03);box-shadow:0 12px 24px -12px rgba(52,217,138,.7);}
.rc.sel{border-color:var(--marigold);background:rgba(52,217,138,0.16);animation:ring 2s ease-in-out infinite;}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(52,217,138,.5)}50%{box-shadow:0 0 0 6px rgba(52,217,138,0)}}
.rc .rfrom{font-family:'Rajdhani','Noto Sans Devanagari',sans-serif;font-size:14px;font-weight:700;color:var(--paper);}
.rc .rarr{font-size:13px;color:var(--marigold);margin:2px 0;display:inline-block;animation:bounceY 1.4s ease-in-out infinite;}
@keyframes bounceY{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.rc .rsub{font-size:9.5px;color:rgba(238,251,243,0.5);}
.rc .rpr{font-size:11.5px;font-weight:700;color:#9af5c6;font-family:'Space Mono',monospace;margin-top:5px;}
#p1 .sec-label{animation:rise .5s .05s both;}
#p1 .rc{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards;}
#p1 .rc:nth-child(1){animation-delay:.12s}
#p1 .rc:nth-child(2){animation-delay:.2s}
#p1 .rc:nth-child(3){animation-delay:.28s}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}

.fgroup{margin-bottom:10px;}
.flbl{font-size:10.5px;color:rgba(238,251,243,0.6);font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px;display:block;}
input,select{width:100%;padding:10px 12px;font-size:14px;font-family:'Inter','Noto Sans Devanagari',sans-serif;background:rgba(0,0,0,0.35);border:1px solid var(--line);border-radius:8px;color:var(--paper);outline:none;transition:border 0.2s;}
input:focus{border-color:var(--marigold);}
input::placeholder{color:rgba(238,251,243,0.32);}
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(1) brightness(0.8);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.bus-shell{background:rgba(0,0,0,0.4);border:1px solid var(--line);border-radius:12px;padding:1rem;margin-bottom:1rem;backdrop-filter:blur(3px);}
.bus-nose{text-align:center;font-family:'Rajdhani',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;color:var(--marigold);border-bottom:2px dashed var(--line);padding-bottom:8px;margin-bottom:10px;text-transform:uppercase;animation:glowText 2s ease-in-out infinite;}
@keyframes glowText{0%,100%{opacity:.7}50%{opacity:1}}
.bus-body{display:flex;gap:0;max-width:220px;margin:0 auto;}
.col-left{display:flex;flex-direction:column;gap:5px;width:52px;}
.col-aisle{width:20px;display:flex;align-items:center;justify-content:center;}
.col-right{display:flex;flex-direction:column;gap:5px;width:28px;}
.aisle-label{writing-mode:vertical-rl;font-size:8.5px;color:rgba(238,251,243,0.25);letter-spacing:1px;font-family:'Rajdhani',sans-serif;text-transform:uppercase;}
.seat{width:100%;height:34px;border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-family:'Space Mono',monospace;cursor:pointer;color:rgba(238,251,243,0.6);background:rgba(0,0,0,0.25);transition:all 0.15s;animation:seatPop .4s cubic-bezier(.34,1.56,.64,1) backwards;}
@keyframes seatPop{from{opacity:0;transform:scale(.3) translateY(10px)}to{opacity:1;transform:none}}
.seat:hover:not(.booked):not(.admin-blocked){border-color:#2fd67f;color:var(--paper);transform:scale(1.06);}
.seat.booked{background:rgba(226,58,78,0.15);color:rgba(255,138,150,0.55);cursor:not-allowed;border-color:rgba(226,58,78,0.25);}
.seat.admin-blocked{background:repeating-linear-gradient(45deg,rgba(150,90,200,0.18),rgba(150,90,200,0.18) 4px,rgba(0,0,0,0.15) 4px,rgba(0,0,0,0.15) 8px);color:rgba(215,170,255,0.6);cursor:not-allowed;border-color:rgba(190,120,230,0.35);}
.seat.selected{background:linear-gradient(135deg,#34d98a,#1fa866);color:var(--ink);border-color:#34d98a;animation:selPulse 1.6s ease-in-out infinite;}
@keyframes selPulse{0%,100%{box-shadow:0 0 8px rgba(52,217,138,.5)}50%{box-shadow:0 0 16px rgba(52,217,138,.95)}}
.seat-pair{display:flex;gap:5px;}
.seat-pair .seat{flex:1;}
.bus-tail{border-top:2px dashed var(--line);margin-top:10px;padding-top:8px;}
.sleeper-row{display:flex;gap:8px;max-width:280px;margin:0 auto;}
.sleeper-row .seat{flex:1;height:52px;border-radius:8px;font-size:9px;flex-direction:column;gap:2px;}
.sleeper-icon{font-size:14px;line-height:1;}
.type-tag{font-size:7.5px;color:var(--marigold);font-family:'Rajdhani',sans-serif;letter-spacing:1px;}
.seat.selected .type-tag{color:var(--ink);opacity:0.7;}
.seat-legend{display:flex;gap:10px;font-size:9.5px;color:rgba(238,251,243,0.5);margin:12px 0 0;justify-content:center;font-family:'Rajdhani',sans-serif;letter-spacing:1px;text-transform:uppercase;flex-wrap:wrap;}
.ldot{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:middle;}

.sel-bar{background:rgba(0,0,0,0.35);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;color:rgba(238,251,243,0.4);margin-bottom:10px;min-height:38px;font-family:'Space Mono','Noto Sans Devanagari',monospace;}

.coupon-box{background:rgba(0,0,0,0.32);border:1px dashed rgba(255,95,162,0.45);border-radius:8px;padding:10px 12px;margin-bottom:10px;}
.coupon-row{display:flex;gap:8px;}
.coupon-row input{flex:1;text-transform:uppercase;letter-spacing:1px;}
.coupon-row input::placeholder{text-transform:none;letter-spacing:normal;}
.btn-coupon{padding:0 16px;border:1px solid var(--marigold);background:transparent;color:var(--marigold);border-radius:8px;font-family:'Rajdhani','Noto Sans Devanagari',sans-serif;font-weight:700;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:all 0.2s;}
.btn-coupon:hover{background:rgba(52,217,138,0.14);}
.coupon-msg{font-size:11.5px;margin-top:7px;font-family:'Rajdhani','Noto Sans Devanagari',sans-serif;font-weight:600;letter-spacing:0.5px;animation:panelIn .4s both;}
.coupon-msg.ok{color:#9af5c6;}
.coupon-msg.bad{color:#ff8a96;}
.coupon-applied-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(31,157,99,0.3);border:1px solid rgba(52,217,138,0.65);color:#9af5c6;border-radius:20px;padding:4px 12px;font-size:11px;font-family:'Rajdhani','Noto Sans Devanagari',sans-serif;font-weight:700;letter-spacing:1px;}

.total-row{display:flex;justify-content:space-between;align-items:center;background:rgba(31,157,99,0.2);border:1px solid rgba(52,217,138,0.5);border-radius:8px;padding:10px 14px;margin-bottom:12px;}
.total-row span:first-child{font-size:11px;font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(238,251,243,0.6);}
.total-row span:last-child{font-size:20px;font-weight:700;font-family:'Space Mono',monospace;color:#9af5c6;animation:popIn .35s both;}
.total-strike{font-size:12px;color:rgba(238,251,243,0.4);text-decoration:line-through;font-family:'Space Mono',monospace;margin-right:8px;}

.btn{position:relative;overflow:hidden;width:100%;padding:13px;border:none;border-radius:10px;font-family:'Rajdhani','Noto Sans Devanagari',sans-serif;font-size:16px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all 0.2s;}
.btn-green{background:linear-gradient(90deg,#3ee08a,#1fa866);color:var(--ink);}
.btn-green:hover{background:linear-gradient(90deg,#6af0ab,#2fd67f);transform:translateY(-1px);}
.btn-green:disabled{background:#1d4a34;color:rgba(238,251,243,0.4);cursor:not-allowed;transform:none;}
.btn-green::after{content:'';position:absolute;top:0;left:-70%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);animation:sweep 3.2s ease-in-out infinite;}
@keyframes sweep{0%{left:-70%}60%,100%{left:130%}}
.btn-ghost{background:rgba(0,0,0,0.3);border:1px solid var(--line);color:rgba(238,251,243,0.6);margin-top:8px;}
.btn-ghost:hover{border-color:rgba(52,217,138,0.6);color:var(--paper);}
.btn-wa{width:100%;padding:13px;border:none;border-radius:10px;font-family:'Rajdhani','Noto Sans Devanagari',sans-serif;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;background:#25d366;color:#0c2515;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;}
.btn-wa:hover{background:#3ee27f;}
.btn:active,.search-btn:active,.day:active,.rc:active{transform:scale(.96);}
.err{color:#ff8a96;font-size:12px;margin-bottom:8px;font-family:'Rajdhani','Noto Sans Devanagari',sans-serif;font-weight:600;}

.ticket{position:relative;background:var(--paper);border-radius:12px;color:var(--ink);margin-bottom:1rem;overflow:visible;animation:ticketIn .7s cubic-bezier(.2,.8,.2,1) both;}
@keyframes ticketIn{from{opacity:0;transform:perspective(600px) rotateX(-25deg) translateY(20px)}to{opacity:1;transform:none}}
.ticket-head{background:var(--ink);color:var(--paper);padding:10px 16px;font-family:'Rajdhani','Noto Sans Devanagari',sans-serif;font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;border-radius:12px 12px 0 0;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--marigold);}
.ticket-head span:last-child{color:var(--marigold);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0;}
.ticket-body{padding:4px 16px 2px;}
.summary-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed rgba(4,23,13,0.2);font-size:13px;}
.summary-row:last-child{border-bottom:none;}
.summary-row span:first-child{color:rgba(4,23,13,0.55);font-family:'Rajdhani','Noto Sans Devanagari',sans-serif;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;font-size:11px;white-space:nowrap;}
.summary-row span:last-child{color:var(--ink);font-weight:600;font-family:'Space Mono','Noto Sans Devanagari',monospace;font-size:12.5px;text-align:right;}
.summary-row.tl span:last-child{color:var(--pine-dim);font-size:19px;font-weight:700;}
.barcode{display:flex;align-items:flex-end;gap:2px;height:34px;padding:10px 16px 4px;}
.barcode span{display:block;background:var(--ink);width:2px;transform-origin:bottom;animation:barGrow .5s ease backwards;}
@keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.ticket-foot{padding:6px 16px 14px;text-align:center;}
.ticket-foot .ref{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:3px;color:rgba(4,23,13,0.55);}

.qr-wrap{background:var(--paper);border-radius:0 0 12px 12px;padding:1rem;text-align:center;color:var(--ink);}
.qr-ttl{font-family:'Rajdhani','Noto Sans Devanagari',sans-serif;font-size:10.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--pine-dim);margin-bottom:8px;}
.qr-img{width:126px;height:126px;border-radius:8px;border:2px solid rgba(4,23,13,0.2);}
.qr-acc{font-size:10.5px;color:rgba(4,23,13,0.55);margin-top:6px;font-family:'Space Mono',monospace;}

.success-wrap{text-align:center;padding:0.5rem 0;position:relative;}
.stamp{position:absolute;top:6px;right:6px;border:3px double var(--rust);color:var(--rust);font-family:'Rajdhani','Noto Sans Devanagari',sans-serif;font-weight:700;font-size:13px;letter-spacing:2px;padding:6px 10px;border-radius:8px;opacity:0.85;text-transform:uppercase;z-index:4;background:rgba(226,58,78,0.05);animation:stampIn .5s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes stampIn{from{opacity:0;transform:rotate(-9deg) scale(3)}to{opacity:.85;transform:rotate(-9deg) scale(1)}}
.success-icon{width:60px;height:60px;background:rgba(31,157,99,0.25);border:2px solid var(--marigold);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:26px;color:#9af5c6;animation:popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both;}
@keyframes popIn{from{opacity:0;transform:scale(0.5)}to{opacity:1;transform:scale(1)}}
.success-title{font-family:'Rajdhani','Noto Sans Devanagari',sans-serif;font-size:26px;font-weight:700;margin-bottom:6px;background:linear-gradient(90deg,#9af5c6,#34d98a,#ff8abf);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.success-sub{font-size:13px;color:rgba(238,251,243,0.65);line-height:1.6;margin-bottom:1rem;}
.notif-box{background:rgba(0,0,0,0.32);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px;}
.notif-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px;color:rgba(238,251,243,0.5);text-align:left;animation:panelIn .5s both;}
.notif-row.ok{color:#9af5c6;} .notif-row.fail{color:#ff8a96;}
.ndot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0;}
.diag{font-size:10.5px;color:rgba(238,251,243,0.4);margin-top:4px;font-family:'Space Mono',monospace;text-align:left;line-height:1.5;word-break:break-word;}

.datebar{background:rgba(0,0,0,0.38);border:1px solid var(--line);border-radius:16px;padding:14px;animation:rise .6s .35s cubic-bezier(.2,.8,.2,1) both;backdrop-filter:blur(3px);}
.datebar-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
.date-pick{position:relative;cursor:pointer;flex:1;}
.date-lbl{font-family:'Rajdhani','Noto Sans Devanagari',sans-serif;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:rgba(238,251,243,0.5);margin-bottom:4px;}
.date-val{display:flex;align-items:center;gap:10px;color:rgba(238,251,243,0.7);}
.date-val span{font-size:22px;font-weight:700;color:var(--paper);}
#travel-date{position:absolute;left:0;bottom:0;width:100%;height:100%;opacity:0;pointer-events:none;}
.search-btn{width:64px;height:64px;border:none;border-radius:16px;background:linear-gradient(135deg,#3ee08a,#1fa866);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;box-shadow:0 8px 20px -6px rgba(52,217,138,0.6);transition:all .2s;animation:pulse 2.2s ease-in-out 1.2s infinite;}
.search-btn:hover{background:linear-gradient(135deg,#6af0ab,#2fd67f);transform:translateY(-2px) rotate(-6deg);}
@keyframes pulse{0%,100%{box-shadow:0 8px 20px -6px rgba(52,217,138,0.5)}50%{box-shadow:0 8px 28px 2px rgba(52,217,138,0.8)}}
.day-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.day-strip::-webkit-scrollbar{display:none;}
.day{flex:0 0 62px;text-align:center;padding:10px 4px;border-radius:12px;background:rgba(238,251,243,0.06);border:1px solid var(--line);cursor:pointer;color:rgba(238,251,243,0.6);transition:all .3s cubic-bezier(.34,1.56,.64,1);}
.day:hover{border-color:rgba(52,217,138,0.6);transform:translateY(-3px);}
.day .dw{font-family:'Rajdhani','Noto Sans Devanagari',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.day .dd{font-size:22px;font-weight:700;color:var(--paper);margin:2px 0;font-family:'Rajdhani',sans-serif;}
.day .dm{font-size:11px;font-weight:600;color:var(--pink);font-family:'Rajdhani','Noto Sans Devanagari',sans-serif;letter-spacing:1px;text-transform:uppercase;}
.day.sel{background:linear-gradient(160deg,#34d98a,#1fa866);border-color:#34d98a;color:var(--ink);box-shadow:0 8px 18px -8px rgba(52,217,138,0.9);transform:translateY(-2px);}
.day.sel .dd,.day.sel .dm{color:var(--ink);}

.lov{position:absolute;inset:0;background:rgba(4,14,9,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;border-radius:18px;}
.spinner{width:38px;height:38px;border:3px solid rgba(52,217,138,0.15);border-top-color:var(--marigold);border-radius:50%;animation:spin 0.75s linear infinite;margin-bottom:12px;}
@keyframes spin{to{transform:rotate(360deg)}}
.lov-msg{font-family:'Rajdhani','Noto Sans Devanagari',sans-serif;font-size:13px;color:var(--marigold);letter-spacing:1px;text-transform:uppercase;}
.lov-sub{font-size:11px;color:rgba(238,251,243,0.4);margin-top:6px;text-align:center;max-width:260px;}
.confetti{position:absolute;top:-10px;width:8px;height:12px;z-index:40;pointer-events:none;animation:conf 2.4s ease-in forwards;}
@keyframes conf{to{transform:translate(var(--dx),640px) rotate(var(--rot));opacity:0}}

/* Nepali (Devanagari): no letter-spacing / forced caps, use Noto */
html[lang="ne"] body *{letter-spacing:0 !important;text-transform:none !important;font-family:'Noto Sans Devanagari','Inter',sans-serif !important;}
html[lang="ne"] .day .dd{font-family:'Rajdhani','Noto Sans Devanagari',sans-serif !important;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important;}}

/* ═══ PINK · RED · GREEN THEME ═══ */
:root{ --grad:linear-gradient(90deg,#34d98a,#ff5fa2,#e23a4e); --grad2:linear-gradient(135deg,#34d98a,#ff5fa2 55%,#e23a4e); }
body{background:radial-gradient(circle at 15% 10%,#0f4a2b 0,transparent 45%),radial-gradient(circle at 90% 20%,#5a0f35 0,transparent 45%),radial-gradient(circle at 50% 100%,#4a0a18 0,#06130c 70%);background-color:#06130c;}

/* animated background: faster 3-colour drift + rotating aurora + recoloured waves */
.bg-layer{background:linear-gradient(135deg,#052313,#0c4a2c,#5a0f3a,#6b0f1f,#0c4a2c);background-size:400% 400%;animation:bgshift 14s ease-in-out infinite;}
.bg-layer::after{content:'';position:absolute;left:50%;top:50%;width:170%;aspect-ratio:1;margin:-85% 0 0 -85%;
  background:conic-gradient(from 0deg,rgba(52,217,138,.55),rgba(255,95,162,.5),rgba(226,58,78,.5),rgba(52,217,138,.55));
  filter:blur(70px);opacity:.38;mix-blend-mode:screen;animation:aurora 26s linear infinite;pointer-events:none;}
@keyframes aurora{to{transform:rotate(360deg)}}
.wave.w1 path{fill:#16a863}
.wave.w2 path{fill:#c4287a}
.wave.w3 path{fill:#8a1428}

/* gradient accents everywhere */
.brand-name{background:linear-gradient(90deg,#34d98a,#ff8abf,#e23a4e,#34d98a);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.lang-btn.on,.step.active,.btn-green,.search-btn,.day.sel,.seat.selected{background:var(--grad2);color:#fff;border-color:#ff5fa2;}
.btn-green:hover,.search-btn:hover{background:linear-gradient(135deg,#6af0ab,#ff8abf 55%,#f0586b);}
.btn-green:disabled{background:#4a1f35;color:rgba(255,255,255,.4);}
.day.sel .dd,.day.sel .dm,.seat.selected .type-tag{color:#fff;}
.step.done{background:rgba(255,95,162,.22);border-color:rgba(255,95,162,.6);color:#ffc2dc;}
.sec-label,.logo-text,.bus-nose,.type-tag{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.seat.selected .type-tag{-webkit-text-fill-color:#fff;}
.logo-badge{border-color:rgba(255,95,162,.5);background:rgba(255,95,162,.1);}
.rc:hover{border-color:#ff5fa2;box-shadow:0 12px 24px -12px rgba(255,95,162,.8);}
.rc.sel{border-color:#ff5fa2;background:linear-gradient(160deg,rgba(52,217,138,.18),rgba(255,95,162,.18),rgba(226,58,78,.16));}
.rc .rarr{color:#ff8abf;}
.price-pill{background:linear-gradient(90deg,rgba(31,157,99,.4),rgba(255,95,162,.35));border-color:rgba(255,95,162,.6);color:#ffd3e5;}
.total-row{background:linear-gradient(90deg,rgba(31,157,99,.25),rgba(255,95,162,.22),rgba(226,58,78,.2));border-color:rgba(255,95,162,.5);}
.total-row span:last-child{color:#ffd3e5;}
.ticket-head{border-bottom:3px solid #ff5fa2;}
.ticket-head span:last-child{color:#34d98a;}
.datebar,.bus-shell{border-color:rgba(255,95,162,.25);}
input:focus{border-color:#ff5fa2;}
.btn-coupon{border-color:#ff5fa2;color:#ff8abf;}
.seat.booked{background:rgba(226,58,78,.28);}
.spinner{border-top-color:#ff5fa2;}
.day .dm{color:#ff8abf;}
html[lang="ne"] .day .dm{font-size:10px;}

/* ═══ MOVING ROAD (over the original background) ═══ */
.road{position:absolute;left:0;right:0;bottom:0;height:62%;overflow:hidden;
  -webkit-mask-image:linear-gradient(to top,#000 45%,transparent);mask-image:linear-gradient(to top,#000 45%,transparent);opacity:.9;}
.road-plane{position:absolute;left:50%;bottom:-6%;width:260%;height:230%;margin-left:-130%;transform-origin:50% 100%;
  transform:perspective(320px) rotateX(72deg);
  background:linear-gradient(90deg,transparent 0 33%,#e9fff3 33% 33.7%,#0d1411 33.7% 66.3%,#e9fff3 66.3% 67%,transparent 67%);}
.road-plane::after{content:'';position:absolute;left:49.65%;width:.7%;top:0;bottom:0;
  background:repeating-linear-gradient(180deg,#34d98a 0 80px,transparent 80px 180px);background-size:100% 180px;
  animation:roadmove .8s linear infinite;}
.road-plane::before{content:'';position:absolute;left:33.7%;width:32.6%;top:0;bottom:0;
  background:linear-gradient(90deg,rgba(255,95,162,.12),transparent 25%,transparent 75%,rgba(226,58,78,.12));}
@keyframes roadmove{to{background-position:0 180px}}
</style>
</head>
<body>
<div class="app">
  <div class="bg-layer">
    <div class="road"><div class="road-plane"></div></div>
    <canvas id="live"></canvas>
    <div class="waves">
      <svg class="wave w3" viewBox="0 0 1200 150" preserveAspectRatio="none" aria-hidden="true"><path d="M0 70 C150 20 300 120 450 70 S750 20 900 70 S1100 110 1200 70 V150 H0z" fill="#2a0f1c"/></svg>
      <svg class="wave w2" viewBox="0 0 1200 150" preserveAspectRatio="none" aria-hidden="true"><path d="M0 70 C150 20 300 120 450 70 S750 20 900 70 S1100 110 1200 70 V150 H0z" fill="#0f5a38"/></svg>
      <svg class="wave w1" viewBox="0 0 1200 150" preserveAspectRatio="none" aria-hidden="true"><path d="M0 70 C150 20 300 120 450 70 S750 20 900 70 S1100 110 1200 70 V150 H0z" fill="#16a863"/></svg>
      <div class="glowline"></div>
    </div>
  </div>
  <div class="lov" id="lov" style="display:none">
    <div class="spinner"></div>
    <div class="lov-msg" id="lov-msg">…</div>
    <div class="lov-sub" id="lov-sub"></div>
  </div>
  <div class="content">
    <div class="lang">
      <div class="lang-pill" role="group" aria-label="Language">
        <button type="button" class="lang-btn on" id="lang-en" onclick="setLang('en')">English</button>
        <button type="button" class="lang-btn" id="lang-ne" onclick="setLang('ne')">नेपाली</button>
      </div>
    </div>
    <div class="header">
      <div class="logo-badge"><div class="logo-dot"></div><span class="logo-text" data-i18n="live">Live Booking</span></div>
      <div class="brand-name">Sambriddhi <span>Air</span></div>
      <div class="route-strip"><span class="busrun">🚌</span><span data-i18n="c_Dharan"></span><span class="dash"></span><span data-i18n="c_Itahari"></span><span class="dash"></span><span data-i18n="c_Pokhara"></span></div>
      <div class="price-pill" data-i18n="pill"></div>
    </div>
    <div class="steps">
      <div class="step active" id="s1" data-i18n="st1"></div>
      <div class="step" id="s2" data-i18n="st2"></div>
      <div class="step" id="s3" data-i18n="st3"></div>
      <div class="step" id="s4" data-i18n="st4"></div>
    </div>

    <!-- STEP 1 -->
    <div class="panel active" id="p1">
      <div class="sec-label" data-i18n="chooseRoute"></div>
      <div class="routes">
        <div class="rc sel" onclick="selRoute(this,'Dharan','Pokhara')"><div class="rfrom" data-i18n="c_Dharan"></div><div class="rarr">↓</div><div class="rfrom" data-i18n="c_Pokhara"></div><div class="rsub" data-i18n="daily430"></div><div class="rpr" data-i18n="price25"></div></div>
        <div class="rc" onclick="selRoute(this,'Pokhara','Dharan')"><div class="rfrom" data-i18n="c_Pokhara"></div><div class="rarr">↓</div><div class="rfrom" data-i18n="c_Dharan"></div><div class="rsub" data-i18n="daily430"></div><div class="rpr" data-i18n="price25"></div></div>
        <div class="rc" onclick="selRoute(this,'Itahari','Pokhara')"><div class="rfrom" data-i18n="c_Itahari"></div><div class="rarr">↓</div><div class="rfrom" data-i18n="c_Pokhara"></div><div class="rsub" data-i18n="daily500"></div><div class="rpr" data-i18n="price25"></div></div>
      </div>
      <div class="datebar">
        <div class="datebar-top">
          <div class="date-pick" onclick="openPicker()">
            <div class="date-lbl" data-i18n="date"></div>
            <div class="date-val">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
              <span id="date-text">—</span>
            </div>
            <input type="date" id="travel-date" onchange="onNativeDate(this.value)">
          </div>
          <button type="button" class="search-btn" onclick="goStep(2)" aria-label="Search seats">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          </button>
        </div>
        <div class="day-strip" id="day-strip"></div>
      </div>
      <div id="p1e" class="err" style="display:none;margin-top:8px;" data-i18n="errDate"></div>
    </div>

    <!-- STEP 2 -->
    <div class="panel" id="p2">
      <div class="bus-shell">
        <div class="bus-nose" data-i18n="front"></div>
        <div class="bus-body" id="bus-body"></div>
        <div class="bus-tail">
          <div style="text-align:center;font-size:10px;color:rgba(238,251,243,0.4);letter-spacing:2px;margin-bottom:6px;text-transform:uppercase;" data-i18n="sleeperTitle"></div>
          <div class="sleeper-row" id="sleeper-row"></div>
        </div>
        <div class="seat-legend">
          <span><span class="ldot" style="background:rgba(0,0,0,0.25);border:1px solid var(--line);"></span><span data-i18n="lFree"></span></span>
          <span><span class="ldot" style="background:var(--marigold);"></span><span data-i18n="lSel"></span></span>
          <span><span class="ldot" style="background:rgba(226,58,78,0.15);border:1px solid rgba(226,58,78,0.25);"></span><span data-i18n="lBooked"></span></span>
          <span><span class="ldot" style="background:rgba(190,120,230,0.25);border:1px solid rgba(190,120,230,0.35);"></span><span data-i18n="lRes"></span></span>
        </div>
      </div>
      <div class="sel-bar" id="sel-bar"></div>

      <div class="coupon-box">
        <label class="flbl" data-i18n="couponQ"></label>
        <div class="coupon-row">
          <input type="text" id="coupon-input" data-i18n-ph="couponPh">
          <button type="button" class="btn-coupon" id="coupon-btn" onclick="applyCoupon()" data-i18n="apply"></button>
        </div>
        <div class="coupon-msg" id="coupon-msg" style="display:none"></div>
      </div>

      <div class="total-row"><span data-i18n="total"></span><span id="seat-total">Rs. 0</span></div>
      <div id="p2e" class="err" style="display:none" data-i18n="errSeat"></div>
      <button class="btn btn-green" onclick="goStep(3)" data-i18n="nextDetails"></button>
      <button class="btn btn-ghost" onclick="goStep(1)" data-i18n="back"></button>
    </div>

    <!-- STEP 3 -->
    <div class="panel" id="p3">
      <div class="sec-label" data-i18n="paxDetails"></div>
      <div class="form-row" style="margin-bottom:10px;">
        <div class="fgroup"><label class="flbl" data-i18n="fullName"></label><input type="text" id="pax-name" data-i18n-ph="namePh"></div>
        <div class="fgroup"><label class="flbl" data-i18n="phone"></label><input type="tel" id="pax-phone" placeholder="98XXXXXXXX"></div>
      </div>
      <div class="fgroup"><label class="flbl" data-i18n="emailOpt"></label><input type="email" id="pax-email" placeholder="your@email.com"></div>
      <div id="p3e" class="err" style="display:none" data-i18n="errPax"></div>
      <button class="btn btn-green" onclick="goStep(4)" data-i18n="review"></button>
      <button class="btn btn-ghost" onclick="goStep(2)" data-i18n="back"></button>
    </div>

    <!-- STEP 4 -->
    <div class="panel" id="p4">
      <div id="review-view">
        <div class="sec-label" data-i18n="summary"></div>
        <div class="ticket">
          <div class="ticket-head"><span data-i18n="boarding"></span><span id="sum-ref">— — —</span></div>
          <div class="ticket-body" id="sum-rows"></div>
          <div class="barcode" id="sum-barcode"></div>
        </div>
        <div class="qr-wrap" style="border-radius:12px;margin-bottom:1rem;">
          <div class="qr-ttl" data-i18n="payQR"></div>
          <img class="qr-img" src="esewa_qr.jpg" alt="Payment QR" onerror="this.alt='QR not found'">
          <div class="qr-acc">Samir Ghimire — Acc: 55510731797</div>
        </div>
        <button class="btn btn-green" id="confirm-btn" onclick="confirmBooking()" data-i18n="confirm"></button>
        <button class="btn btn-ghost" onclick="goStep(3)" data-i18n="back"></button>
      </div>
      <div id="success-view" style="display:none;">
        <div class="success-wrap">
          <div class="success-icon" id="success-icon">✓</div>
          <div class="success-title" id="success-title" data-i18n="doneTitle"></div>
          <div class="success-sub" id="success-sub"></div>
          <div class="notif-box">
            <div class="notif-row" id="n-save"><div class="ndot"></div><span id="n-save-txt"></span></div>
            <div class="notif-row" id="n-email"><div class="ndot"></div><span id="n-email-txt"></span></div>
            <div class="diag" id="n-diag" style="display:none;"></div>
          </div>
          <div class="ticket" style="text-align:left;">
            <div class="stamp" id="stamp" style="display:none;" data-i18n="stamp"></div>
            <div class="ticket-head"><span data-i18n="boarding"></span><span id="suc-ref">— — —</span></div>
            <div class="ticket-body" id="success-rows"></div>
            <div class="barcode" id="suc-barcode"></div>
            <div class="ticket-foot"><div class="ref" id="suc-ref2"></div></div>
          </div>
          <div class="qr-wrap" style="border-radius:12px;margin:0 0 1rem;">
            <div class="qr-ttl" data-i18n="scanPay"></div>
            <img class="qr-img" src="esewa_qr.jpg" alt="Payment QR">
            <div class="qr-acc">Samir Ghimire — Acc: 55510731797</div>
          </div>
          <a id="wa-btn" href="#" target="_blank" class="btn-wa">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#0c2515"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            <span data-i18n="notifyWa"></span>
          </a>
          <button class="btn btn-ghost" onclick="resetAll()" style="margin-top:8px;" data-i18n="another"></button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════

const I18N = {

    paxDetails:'Passenger details', fullName:'Full name', namePh:'Your name', phone:'Phone', emailOpt:'Email (optional)',
    errPax:'Please fill your name and phone number.', review:'Review Booking →',

    savingNote:'Saving booking…', saved:'✓ Booking saved to database', saveFail:'⚠ Save failed: {err} — use WhatsApp',
    sendingEmail:'Sending email notification…', emailOk:'✓ Email sent to operator', emailFail:'⚠ Email failed — use WhatsApp below',

// ── Bikram Sambat (Nepali) dates ─────────────────
// Month lengths from the Government of Nepal national panchang: BS 2082 and 2083
// (14 Apr 2025 → 13 Apr 2027). Dates outside this window fall back to the normal format.
const BS_ROW   = [31,31,32,31,31,31,30,29,30,29,30,30];
const BS_DATA  = {2082:BS_ROW, 2083:BS_ROW};
const BS_START = Date.UTC(2025,3,14);   // 1 Baisakh 2082
const BS_MONTHS = ['बैशाख','जेठ','असार','श्रावण','भदौ','असोज','कार्तिक','मंसिर','पौष','माघ','फागुन','चैत'];
const dev = n => String(n).replace(/\d/g, x => '०१२३४५६७८९'[x]);
function toBS(d){
  let n = Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()) - BS_START) / 864e5);
  if(n < 0) return null;
  for(const y of [2082,2083]){
    const a = BS_DATA[y];
    for(let m=0;m<12;m++){ if(n < a[m]) return {y, m, d:n+1}; n -= a[m]; }
  }
  return null;
}
function fmtLong(iso){
  const d = new Date(iso+'T00:00:00');
  if(LANG==='ne'){ const b = toBS(d); if(b) return dev(b.d)+' '+BS_MONTHS[b.m]+' '+dev(b.y); }
  return d.getDate()+' '+MON_L[LANG][d.getMonth()]+' '+d.getFullYear();
}
function fmtEn(iso){ return new Date(iso).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }

// Live animated background (canvas): glowing orbs + drifting sparks. Even mix of green, pink and red.
(function(){
  const cv=document.getElementById('live'), app=document.querySelector('.app'), ctx=cv.getContext('2d');
  const reduce=window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0,H=0,dpr=Math.min(window.devicePixelRatio||1,2);
  const GREEN=[[52,217,138],[31,190,110],[110,245,180]], PINK=[255,95,162], RED=[226,58,78];
  const pick=i=>{ const r=i%9; return r<3?GREEN[i%3]:(r<6?PINK:RED); };
  const orbs=[], sparks=[];
  function resize(){ W=app.clientWidth; H=app.clientHeight; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  function init(){
    resize(); orbs.length=0; sparks.length=0;
    for(let i=0;i<10;i++) orbs.push({x:Math.random()*W,y:Math.random()*H,r:90+Math.random()*130,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,ph:Math.random()*6.28,c:pick(i),a:.22+Math.random()*.16});
    for(let i=0;i<46;i++) sparks.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+.8,vx:(Math.random()-.5)*.3,vy:-(Math.random()*.5+.15),c:pick(i+3),a:Math.random()*.5+.25,ph:Math.random()*6.28});
  }
  function frame(ts){
    if(document.hidden){ requestAnimationFrame(frame); return; }
    const t=ts/1000; ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';
    for(const o of orbs){
      o.x+=o.vx; o.y+=o.vy;
      if(o.x<-o.r) o.x=W+o.r; if(o.x>W+o.r) o.x=-o.r;
      if(o.y<-o.r) o.y=H+o.r; if(o.y>H+o.r) o.y=-o.r;
      const R=o.r*(1+Math.sin(t*.8+o.ph)*.12);
      const g=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,R);
      g.addColorStop(0,`rgba(${o.c[0]},${o.c[1]},${o.c[2]},${o.a})`);
      g.addColorStop(1,`rgba(${o.c[0]},${o.c[1]},${o.c[2]},0)`);
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(o.x,o.y,R,0,6.283); ctx.fill();
    }
    for(const p of sparks){
      p.x+=p.vx+Math.sin(t+p.ph)*.12; p.y+=p.vy;
      if(p.y<-8){ p.y=H+8; p.x=Math.random()*W; }
      if(p.x<-8) p.x=W+8; if(p.x>W+8) p.x=-8;
      const tw=.55+Math.sin(t*2+p.ph)*.45;
      ctx.fillStyle=`rgba(${p.c[0]},${p.c[1]},${p.c[2]},${p.a*tw})`;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
    }
    ctx.lineWidth=.6;
    for(let i=0;i<sparks.length;i++) for(let j=i+1;j<sparks.length;j++){
      const dx=sparks[i].x-sparks[j].x, dy=sparks[i].y-sparks[j].y, d=dx*dx+dy*dy;
      if(d<4900){ const c=sparks[i].c; ctx.strokeStyle=`rgba(${c[0]},${c[1]},${c[2]},${(1-d/4900)*.22})`; ctx.beginPath(); ctx.moveTo(sparks[i].x,sparks[i].y); ctx.lineTo(sparks[j].x,sparks[j].y); ctx.stroke(); }
    }
    ctx.globalCompositeOperation='source-over';
    if(!reduce) requestAnimationFrame(frame);
  }
  init();
  if(window.ResizeObserver) new ResizeObserver(resize).observe(app); else window.addEventListener('resize',resize);
  requestAnimationFrame(frame);
})();

// ── Date strip ───────────────────────────────────
function isoLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseIso(s){ return new Date(s+'T00:00:00'); }
function todayLocal(){ const d=new Date(); d.setHours(0,0,0,0); return d; }

function buildStrip(start){
  stripStart = new Date(start);
  const strip=document.getElementById('day-strip'); strip.innerHTML='';
  for(let i=0;i<30;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const el=document.createElement('div');
    el.className='day'; el.dataset.iso=isoLocal(d);
    const b = LANG==='ne' ? toBS(d) : null;
    el.innerHTML=`<div class="dw">${DOW_L[LANG][d.getDay()]}</div><div class="dd">${b?dev(b.d):d.getDate()}</div><div class="dm">${b?BS_MONTHS[b.m]:MON_L[LANG][d.getMonth()]}</div>`;
    el.onclick=()=>pickDate(el.dataset.iso);
    strip.appendChild(el);
  }
}
function pickDate(iso,noScroll){
  document.getElementById('travel-date').value=iso;
  document.getElementById('date-text').textContent=fmtLong(iso);
  document.getElementById('p1e').style.display='none';
  document.querySelectorAll('.day').forEach(el=>{
    const on=el.dataset.iso===iso; el.classList.toggle('sel',on);
    if(on && !noScroll) el.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
  });
}
function openPicker(){
  const i=document.getElementById('travel-date');
  try{ i.style.pointerEvents='auto'; i.showPicker ? i.showPicker() : i.focus(); }catch(e){ i.focus(); }
}
function onNativeDate(v){
  if(!v) return;
  const d=parseIso(v);
  if(!document.querySelector(`.day[data-iso="${v}"]`)) buildStrip(d < todayLocal() ? todayLocal() : d);
  pickDate(v);
}
function initDateStrip(){
  const tdy=todayLocal();
  document.getElementById('travel-date').min=isoLocal(tdy);
  buildStrip(tdy);
  pickDate(isoLocal(tdy));
}

// Coupon is usable: enabled + inside its date window + under its max uses
function couponUsable(c){
  if(!c.active) return false;
  const today=isoLocal(new Date());
  if(c.validFrom && today < c.validFrom) return false;
  if(c.validUntil && today > c.validUntil) return false;
  if(c.maxUses){
    const used=allBookings.filter(b=>b.coupon===c.code && b.status!=='Cancelled').length;
    if(used >= c.maxUses) return false;
  }
  return true;
}
async function applyCoupon(){

  await fetchBookings();   // also refreshes coupons + usage counts
  btn.disabled=false; btn.textContent=t('apply');

  const match=allCoupons.find(c=>c.code===code && couponUsable(c));
  if(match){
    currentPrice=match.priceOverride ? match.priceOverride : Math.round(PRICE*(1-match.percent/100));
    appliedCoupon={code:match.code,percent:match.percent};
    input.value=match.code; input.disabled=true;
    btn.disabled=true; btn.textContent=t('applied');
    couponState='ok';
  }else{
    currentPrice=PRICE; appliedCoupon=null; couponState='bad';
  }
  renderCouponMsg();
  updateSelBar();
}

async function saveNewBooking(booking){
  const id=await getBinId();
  const r=await fetch(`https://api.jsonbin.io/v3/b/${id}/latest`,{headers:{'X-Master-Key':MASTER_KEY,'X-Access-Key':ACCESS_KEY}});
  if(!r.ok) throw new Error('Load failed: HTTP '+r.status);
  const rec=(await r.json()).record;
  const bookings=rec.bookings||[];
  const coupons=rec.coupons||[];
  const newSeats=booking.seats.map(normSeat);
  const taken=bookings.some(b=>b.route===booking.route && b.date===booking.date && b.status!=='Cancelled' && (b.seats||[]).some(s=>newSeats.includes(normSeat(s))));
  if(taken) throw new Error('SEAT_TAKEN');
  bookings.push(booking);
  const p=await fetch(`https://api.jsonbin.io/v3/b/${id}`,{
    method:'PUT',
    headers:{'Content-Type':'application/json','X-Master-Key':MASTER_KEY},
    body:JSON.stringify({bookings,coupons})
  });
  if(!p.ok) throw new Error('Save failed: HTTP '+p.status);
}

// ── Seat helpers ─────────────────────────────────
// Old sleeper IDs SP1/SP2 are now BS1/BS2 — old bookings keep working.
const normSeat = s => { s=String(s); return s==='SP1'?'BS1':s==='SP2'?'BS2':s; };
function getOccupiedSeats(routeStr, date){
  const booked=new Set(), adminBlocked=new Set();
  allBookings.forEach(b=>{
    if(b.route===routeStr && b.date===date && b.status!=='Cancelled'){
      (b.seats||[]).forEach(s=>{
        s=normSeat(s);
        if(b.isAdminBlock) adminBlocked.add(s); else booked.add(s);
      });
    }
  });
  return {booked, adminBlocked};
}
function seatRank(id){
  const s=normSeat(id);
  if(s.startsWith('BS')) return 2000+parseInt(s.slice(2),10);
  if(s.startsWith('AS')) return 2100+parseInt(s.slice(2),10);
  if(s.startsWith('A'))  return 1000+parseInt(s.slice(1),10);
  if(s.startsWith('B'))  return parseInt(s.slice(1),10);
  return 9999;
}
function sortSeats(arr){ return [...arr].sort((a,b)=>seatRank(a)-seatRank(b)); }

    const la='B'+(row*2+1), lb='B'+(row*2+2), rc='A'+(row+1);
    const pair=document.createElement('div'); pair.className='seat-pair';
    pair.appendChild(mkSeat(la,booked,adminBlocked)); pair.appendChild(mkSeat(lb,booked,adminBlocked));
    lCol.appendChild(pair); rCol.appendChild(mkSeat(rc,booked,adminBlocked));
  }
  body.appendChild(lCol); body.appendChild(aiCol); body.appendChild(rCol);
  const slRow=document.getElementById('sleeper-row'); slRow.innerHTML='';
  ['BS1','BS2','AS1','AS2'].forEach((id,i)=>{
    const el=document.createElement('div');
    const isB=booked.has(id),isA=adminBlocked.has(id),isS=selSeats.includes(id);
    el.className='seat'+(isB?' booked':isA?' admin-blocked':isS?' selected':'');
    el.innerHTML=`<span class="sleeper-icon">&#128716;</span><span>${id}</span><span class="type-tag">${esc(t('sleeper'))}</span>`;
    el.style.display='flex';
    if(i===2) el.style.marginLeft='10px';   // gap between B-side and A-side sleepers
    if(!isB&&!isA) el.onclick=()=>toggleSeat(el,id);
    slRow.appendChild(el);
  });
  updateSelBar();
}
function mkSeat(id,booked,adminBlocked){
  const el=document.createElement('div');
  const isB=booked.has(String(id)),isA=adminBlocked.has(String(id)),isS=selSeats.includes(id);
  el.className='seat'+(isB?' booked':isA?' admin-blocked':isS?' selected':'');
  el.textContent=id; el.style.animationDelay=(Math.random()*0.35)+'s';
  if(!isB&&!isA) el.onclick=()=>toggleSeat(el,id);
  return el;
}
function toggleSeat(el,id){
  if(selSeats.includes(id)){ selSeats=selSeats.filter(s=>s!==id); el.classList.remove('selected'); }
  else{ selSeats.push(id); el.classList.add('selected'); }
  updateSelBar();
}
function updateSelBar(){
  const b=document.getElementById('sel-bar'),tt=document.getElementById('seat-total');
  if(!selSeats.length){ b.textContent=t('noSeats'); b.style.color='rgba(238,251,243,0.4)'; }
  else{ b.style.color='var(--paper)'; b.innerHTML='<span style="color:#ff8abf;font-weight:700;">'+esc(t('seatsLbl'))+'</span>'+sortSeats(selSeats).join(', '); }
  const totalNow = selSeats.length*currentPrice;
  if(appliedCoupon && selSeats.length){
    tt.innerHTML = `<span class="total-strike">${t('rs')} ${(selSeats.length*PRICE).toLocaleString()}</span>${t('rs')} ${totalNow.toLocaleString()}`;
  }else{
    tt.textContent=t('rs')+' '+totalNow.toLocaleString();
  }
}

function rowH(l,v,c){ return `<div class="summary-row${c||''}"><span>${l}</span><span>${v}</span></div>`; }
function buildBarcode(el){
  el.innerHTML='';
  for(let i=0;i<38;i++){
    const bar=document.createElement('span');
    bar.style.height=(Math.random()*24+8)+'px';
    bar.style.opacity=Math.random()>0.15?1:0.35; bar.style.animationDelay=(i*0.02)+'s';
    el.appendChild(bar);
  }
}
function buildSummary(tid,refId){
  const name=esc(document.getElementById('pax-name').value.trim());
  const phone=esc(document.getElementById('pax-phone').value.trim());
  const email=esc(document.getElementById('pax-email').value.trim());
  const rs=t('rs');
  document.getElementById(tid).innerHTML=
    rowH(t('lPassenger'),name)+rowH(t('lPhone'),phone)+(email?rowH(t('lEmail'),email):'')+
    rowH(t('lRoute'),cityN(route.from)+' → '+cityN(route.to))+rowH(t('lDate'),fmtLong(tDate))+
    rowH(t('lSeats'),sortSeats(selSeats).join(', '))+
    (appliedCoupon?rowH(t('lCoupon'),esc(appliedCoupon.code)+' ('+t('off',{p:appliedCoupon.percent})+')'):'')+
    rowH(t('lTotal'),rs+' '+(selSeats.length*currentPrice).toLocaleString(),' tl');
  if(refId){
    const short='#'+refId.replace('BK','');
    if(tid==='sum-rows'){
      document.getElementById('sum-ref').textContent=short;
      if(!document.getElementById('sum-barcode').children.length) buildBarcode(document.getElementById('sum-barcode'));
    }else{
      document.getElementById('suc-ref').textContent=short;
      document.getElementById('suc-ref2').textContent=refId+'  ·  '+document.getElementById('pax-phone').value.trim();
      if(!document.getElementById('suc-barcode').children.length) buildBarcode(document.getElementById('suc-barcode'));
    }
  }
}

function selRoute(el,f,tt){ document.querySelectorAll('.rc').forEach(c=>c.classList.remove('sel')); el.classList.add('sel'); route={from:f,to:tt}; }

async function goStep(n){
  if(n===2){
    const d=document.getElementById('travel-date').value;
    if(!d){ document.getElementById('p1e').style.display='block'; return; }
    document.getElementById('p1e').style.display='none'; tDate=d; selSeats=[]; updateSelBar(); await buildBus();
  }
  if(n===3){ if(!selSeats.length){ document.getElementById('p2e').style.display='block'; return; } document.getElementById('p2e').style.display='none'; }
  if(n===4){
    const name=document.getElementById('pax-name').value.trim(), phone=document.getElementById('pax-phone').value.trim();
    if(!name||!phone){ document.getElementById('p3e').style.display='block'; return; }
    document.getElementById('p3e').style.display='none';
    if(!curRef) curRef='BK'+String(Date.now()).slice(-5);
    document.getElementById('sum-barcode').innerHTML='';
    buildSummary('sum-rows', curRef);
  }
  [1,2,3,4].forEach(i=>{ document.getElementById('p'+i).classList.toggle('active',i===n); const s=document.getElementById('s'+i); s.className='step'+(i===n?' active':i<n?' done':''); });
}

// ── Notifications ────────────────────────────────
function setNotif(id,ok,txt){ const el=document.getElementById(id); el.className='notif-row '+(ok?'ok':'fail'); el.querySelector('span').textContent=txt; }
function setNotifPending(id,txt){ const el=document.getElementById(id); el.className='notif-row'; el.querySelector('span').textContent=txt; }

function renderSuccess(){
  if(!run) return;
  buildSummary('success-rows', run.ref);
  document.getElementById('success-sub').innerHTML =
    esc(t('thanks',{name:'\u0001',seats:'\u0002',date:fmtLong(run.date)}))
      .replace('\u0001','<strong style="color:#ff8abf">'+esc(run.name)+'</strong>')
      .replace('\u0002','<strong style="color:#34d98a">'+esc(run.seats)+'</strong>')
    +'<br><span style="font-size:11px;opacity:0.6">'+esc(t('refNote',{ref:run.ref}))+'</span>';
  if(run.save===null) setNotifPending('n-save',t('savingNote'));
  else if(run.save.ok) setNotif('n-save',true,t('saved'));
  else setNotif('n-save',false,t('saveFail',{err: run.save.err==='SEAT_TAKEN' ? t('seatTaken') : run.save.err}));
  if(run.email===null) setNotifPending('n-email',t('sendingEmail'));
  else setNotif('n-email',run.email.ok, run.email.ok ? t('emailOk') : t('emailFail'));
}

async function sendEmailJS(params){
  if(!emailjsReady){
    return {ok:false, errors:['EmailJS library was not available (CDN blocked or offline) — use WhatsApp instead.']};
  }
  const errors=[];
  for(const svc of EJS_SERVICES){
    try{
      const resp = await emailjs.send(svc,EJS_TEMPLATE,params);
      return {ok:true, service:svc, status:resp.status};
    }catch(e){
      const detail = (e && (e.text || e.message)) ? (e.text || e.message) : JSON.stringify(e);
      console.warn('EmailJS failed for service', svc, e);
      errors.push(`${svc} → ${e && e.status ? e.status+' ' : ''}${detail}`);
    }
  }
  return {ok:false, errors};
}

// ── Confirm booking (data sent out is always English) ──
async function confirmBooking(){
  const name=document.getElementById('pax-name').value.trim();
  const phone=document.getElementById('pax-phone').value.trim();
  const email=document.getElementById('pax-email').value.trim();
  const fd=fmtEn(tDate);
  const seats=sortSeats(selSeats).join(', ');
  const total='Rs. '+(selSeats.length*currentPrice).toLocaleString();
  const routeStr=route.from+' → '+route.to;
  const refId=curRef || ('BK'+String(Date.now()).slice(-5));

  document.getElementById('confirm-btn').disabled=true;
  showLoad(t('savingBooking'),t('moment'));

  let saveOk=false, saveErr='';
  try{
    await saveNewBooking({
      id:refId,name,phone,email,route:routeStr,date:tDate,
      seats:sortSeats(selSeats),status:'Pending',
      notes:'Booked via website'+(appliedCoupon?' — coupon '+appliedCoupon.code+' applied':''),
      isAdminBlock:false,pricePerSeat:currentPrice,
      coupon:appliedCoupon?appliedCoupon.code:null,
      created:new Date().toISOString().split('T')[0]
    });
    saveOk=true;
  }catch(e){ console.warn('Save error',e); saveErr=e.message; }

  hideLoad();
  run={ref:refId,name,seats,date:tDate,save:{ok:saveOk,err:saveErr},email:null};
  document.getElementById('suc-barcode').innerHTML='';
  renderSuccess();
  document.getElementById('review-view').style.display='none';
  document.getElementById('success-view').style.display='block';
  if(saveOk) confetti();

  const waMsg=`🚌 *New Booking — Sambriddhi Air Bus*\n\nRef: ${refId}\nPassenger: ${name}\nPhone: ${phone}\nRoute: ${routeStr}\nDate: ${fd}\nSeats: ${seats}\n${appliedCoupon?'Coupon: '+appliedCoupon.code+' ('+appliedCoupon.percent+'% off)\n':''}Total: ${total}\nStatus: Pending Payment\n\nPlease confirm this booking.`;
  document.getElementById('wa-btn').href=`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(waMsg)}`;

  const result = await sendEmailJS({from_name:name,from_email:email||phone+'@noemail.com',booking_ref:refId,route:routeStr,travel_date:fd,seats,total,phone,coupon:appliedCoupon?appliedCoupon.code:'None',to_email:'sambriddhiairbus@gmail.com'});
  run.email={ok:result.ok};
  renderSuccess();
  if(result.ok){
    document.getElementById('stamp').style.display='block';
  } else {
    lastEmailError = result.errors.join(' | ');
    const diag=document.getElementById('n-diag');
    diag.style.display='block';
    diag.textContent = 'Debug: ' + lastEmailError;
  }
}

function resetAll(){
  selSeats=[]; tDate=''; lastEmailError=null; currentPrice=PRICE; appliedCoupon=null; couponState=null; curRef=null; run=null; busReady=false;
  ['pax-name','pax-phone','pax-email'].forEach(id=>document.getElementById(id).value='');
  initDateStrip();
  const cIn=document.getElementById('coupon-input'); cIn.value=''; cIn.disabled=false;
  const cBtn=document.getElementById('coupon-btn'); cBtn.disabled=false; cBtn.textContent=t('apply');
  document.getElementById('coupon-msg').style.display='none';
  document.getElementById('review-view').style.display='block';
  document.getElementById('success-view').style.display='none';
  document.getElementById('stamp').style.display='none';
  document.getElementById('n-diag').style.display='none';
  document.getElementById('confirm-btn').disabled=false;
  goStep(1);
}

// ── Confetti (green · pink · red) ────────────────
function confetti(){
  const app=document.querySelector('.app'), cols=['#34d98a','#ff5fa2','#e23a4e','#2fd67f','#ff8abf','#9af5c6'];
  for(let i=0;i<50;i++){
    const c=document.createElement('div'); c.className='confetti';
    c.style.left=Math.random()*100+'%'; c.style.background=cols[i%cols.length];
    c.style.setProperty('--dx',(Math.random()*160-80)+'px'); c.style.setProperty('--rot',(Math.random()*720-360)+'deg');
    c.style.animationDelay=(Math.random()*0.5)+'s'; c.style.borderRadius=Math.random()>.5?'50%':'2px';
    app.appendChild(c); setTimeout(()=>c.remove(),3200);
  }
}

// ── Start ────────────────────────────────────────
initDateStrip();
applyLang();
</script>
